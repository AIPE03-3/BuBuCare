[project]
name = "fulilian-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt==4.0.1",
    "boto3>=1.43.37",
    "fastapi>=0.138.1",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.49.0",
    "httpx>=0.28.1",
    "kafka-python-ng>=2.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# 只收集 backend/tests/ 的測試：ai/ 底下的測試需要 torch/ultralytics（CI 沒裝），
# 收進來會 import 失敗把 CI 弄紅。AI 端的測試由 albert 自己跑。
testpaths = ["backend/tests"]
# 讓測試可以用 from backend.xxx import ... 的絕對路徑 import 主程式
pythonpath = ["."]
