[project]
name = "fulilian-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt==4.0.1",
    "boto3>=1.43.37",
    "fastapi>=0.138.1",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# 告訴 pytest 去 tests/ 資料夾找測試，跑 uv run pytest 或 python -m pytest 都會自動找到
testpaths = ["tests"]
# 讓測試可以 import 根目錄的 main.py、auth.py 等主程式檔案
pythonpath = ["."]
