server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SSE 即時推播：關閉 nginx 緩衝，否則訊息會被 nginx 囤著不即時吐出
  location /api/stream {
    proxy_pass http://backend:8000/stream;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # 其他 API：把 /api 帽子拿掉，轉給後端（/api/events → 後端 /events）
  location /api/ {
    proxy_pass http://backend:8000/;
  }

  # 其餘一律回 React 首頁，交給前端路由自己處理
  location / {
    try_files $uri $uri/ /index.html;
  }
}
