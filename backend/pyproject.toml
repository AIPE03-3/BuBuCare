[project]
name = "fulilian-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt==4.0.1",
    "boto3>=1.43.37",
    "fastapi>=0.138.1",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.49.0",
    "httpx>=0.28.1",
    "kafka-python-ng>=2.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# 只收集 tests/ 的測試（此 pyproject 已在 backend/ 內，路徑基準即 backend/）。
testpaths = ["tests"]
# backend/ 自己就是根，把它加進 import 路徑，讓測試用 from core.xxx import ... 找得到主程式
pythonpath = ["."]
