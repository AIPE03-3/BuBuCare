services:
  # 1. Kafka（KRaft 版：郵局自己當管家，不再需要 Zookeeper 容器）
  kafka:
    image: apache/kafka:3.9.0
    container_name: nh-kafka
    ports:
      - "9092:9092"
    environment:
      # ── 兩扇門：對外給 host/AI，對內給同網路容器（維持舊值，AI 端與 consumer 零改碼）──
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_INTERNAL://:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      # ── KRaft 標準開機設定（單機，副本數皆 1），照官方建議填 ──
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  # 2. kafka-ui（透明監控窗：用瀏覽器看 topic 與訊息，除錯用，可移除）
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nh-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # 3. 後端（FastAPI 網站 + Kafka 收件人，合併在同一容器）
  backend:
    build:
      context: ./backend      # 廚房範圍＝backend/
      dockerfile: Dockerfile
    container_name: nh-backend
    depends_on:
      - kafka
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env:ro     # 掛入 .env 讓容器內 python-dotenv 讀取。不用 compose env_file：
                                # env_file 會把密碼裡的 $ 當變數展開而挖空密碼（python-dotenv 不會）
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092        # 容器內走內線找 Kafka（覆蓋 .env）
      EVENTS_URL: http://localhost:8000/events    # 收件人打自家網站（同容器內 localhost 即自己）

  # 4. 前端（React 經 nginx 服務 + 反向代理到後端）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nh-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
