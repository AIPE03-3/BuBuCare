server {
	listen 80 default_server;
	server_name _;

    # 1. 根路徑：直接給前端靜態網頁
    location / {
        root /usr/share/nginx/html; # 你的 Vue/React 打包出來的資料夾
        index index.html;
        try_files $uri $uri/ /index.html; # 支援 SPA (Single Page Application) 路由
    }

    # 2. 只要網址開頭是 /api/，就幫我轉寄給後端 FastAPI
	# /api 本身不轉後端
	location = /api {
		return 404;
	}

	# 不公開後端監控／健康檢查
	location = /api/metrics {
		return 404;
	}
	#location = /api/health {
	#	return 404;
	#}

	# 對外 API：/api/events → FastAPI /events
    location /api/ {
	    # 【關鍵修改 1】指定 Docker 內網的 DNS 伺服器，並關閉 IPv6 解析避免報錯
        resolver 127.0.0.11 ipv6=off;
		
		# 【關鍵修改 2】用變數把後端網址存起來，騙過 Nginx 的啟動檢查
        set $backend_service "http://python:8000";
	
		# 移除對外使用的 /api/ 前綴
		rewrite ^/api/(.*)$ /$1 break;
	
		# 【關鍵修改 3】proxy_pass 改用變數
        # 注意：當 proxy_pass 使用變數時，後方若有帶路徑（如 /api/）的行為會改變。
        # 為了保全您原本轉發給 FastAPI 的路徑，建議直接帶入 $request_uri 或保持原樣
        proxy_pass $backend_service; 
		#1.resolver 127.0.0.11 ipv6=off;：這是 Docker 內建的 DNS 位址。Nginx 現在知道要在收到請求時，向它詢問名叫 python 的容器 IP 在哪裡。
		#2. set $backend_service ...：把網址變成字串變數。Nginx 在「啟動時」看到變數，就不會笨笨地去連線測試，因而順利啟動。
		#直到有前端真的發送 /api/ 請求時，Nginx 才會在「當下」去抓 Python 的連線。
		
        #proxy_pass http://python:8000; # 轉發給同一個 Docker 內網的 FastAPI
		
		proxy_http_version 1.1;
		
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";
		
		# SSE /stream 需要避免緩衝，設在這裡也不影響一般 API 正確性
		proxy_buffering off;
		proxy_cache off;
		proxy_send_timeout 300;
		proxy_read_timeout 3600;
		proxy_connect_timeout 30;
    }
}
